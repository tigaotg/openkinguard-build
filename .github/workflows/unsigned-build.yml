name: OpenKinGuard unsigned APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/unsigned-build.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build unsigned APK
        run: |
          sed -i 's/compileSdk = 37/compileSdk = 36/' app/build.gradle.kts
          sed -i 's/compose-bom:2026.09.00/compose-bom:2025.10.00/' app/build.gradle.kts
          sed -i 's/signingConfig = signingConfigs.getByName("isolatedPilotV4")/signingConfig = null/' app/build.gradle.kts
          chmod +x gradlew
          ./gradlew --no-daemon :security:protocol:test :app:testDebugUnitTest :app:assemblePilotV4 --stacktrace || { for f in app/build/test-results/testDebugUnitTest/TEST-*.xml; do if [ -f "$f" ]; then grep -A 35 '<failure' "$f" || true; fi; done; exit 1; }
      - name: Package APK and signing tool
        run: |
          mkdir -p build-out
          APK_FILE=$(find app/build/outputs/apk/pilotV4 -maxdepth 1 -name '*.apk' -type f -print -quit)
          test -n "$APK_FILE" || exit 1
          cp "$APK_FILE" build-out/OpenKinGuard-0.9.23-PilotV4-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" build-out/
      - uses: actions/upload-artifact@v4
        with:
          name: OpenKinGuard-0.9.23-unsigned-build
          path: build-out/*
          if-no-files-found: error
          retention-days: 7
