name: OpenKinGuard Android emulator smoke tests

on:
  # Manual-only. Phase 2 source validation must not build or install an APK.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install build SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare isolated CI signing identity
        run: |
          # Never copy or publish the owner's Pilot V4 release signing material.
          # This key is ephemeral and valid only for these disposable emulators.
          mkdir -p private-signing
          keytool -genkeypair -noprompt \
            -keystore private-signing/openkinguard-s1-diagnostic-debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname 'CN=OpenKinGuard CI, OU=Tests, O=OpenKinGuard, C=CN'
          sed -i 's/compileSdk = 37/compileSdk = 36/' app/build.gradle.kts
          sed -i 's/compose-bom:2026.09.00/compose-bom:2025.10.00/' app/build.gradle.kts
          sed -i 's/signingConfig = signingConfigs.getByName("isolatedPilotV4")/signingConfig = signingConfigs.getByName("debug")/' app/build.gradle.kts
      - name: Run protocol and application unit tests; build CI-only APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :security:protocol:test :app:testDebugUnitTest :app:assemblePilotV4 --stacktrace
      - name: Upload disposable emulator APK
        uses: actions/upload-artifact@v4
        with:
          name: openkinguard-emulator-only-apk
          path: app/build/outputs/apk/pilotV4/*.apk
          if-no-files-found: error
          retention-days: 2
      - name: Publish unit test XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openkinguard-unit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            security/protocol/build/test-results/test/
          if-no-files-found: warn
          retention-days: 7

  emulator-startup:
    needs: build-and-unit-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            name: Android 10
          - api: 36
            name: Android 16
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    name: Emulator ${{ matrix.name }} (API ${{ matrix.api }})
    env:
      # Both avdmanager and emulator must resolve the same writable AVD directory.
      ANDROID_AVD_HOME: /tmp/okg-android-avds
      ANDROID_USER_HOME: /tmp/okg-android-user
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v4
        with:
          name: openkinguard-emulator-only-apk
          path: emulator-apk
      - name: Provision Android emulator and enable hardware acceleration
        run: |
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          sdkmanager --install emulator "system-images;android-${{ matrix.api }};google_apis;x86_64"
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          printf 'no\n' | avdmanager create avd --force --name okg-smoke \
            --package "system-images;android-${{ matrix.api }};google_apis;x86_64"
          echo 'AVDs visible to Android emulator:'
          "$ANDROID_HOME/emulator/emulator" -list-avds
          test -f "$ANDROID_AVD_HOME/okg-smoke.ini"
      - name: Boot emulator and run application smoke checks
        run: |
          mkdir -p emulator-logs
          "$ANDROID_HOME/emulator/emulator" -avd okg-smoke \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -no-metrics > emulator-logs/emulator.txt 2>&1 &
          echo $! > emulator-logs/emulator.pid
          if ! timeout 300 bash -c '
            until [ "$(timeout 8 adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do
              if ! kill -0 "$(<emulator-logs/emulator.pid)" 2>/dev/null; then
                echo "Emulator process exited before boot completed" >&2
                exit 2
              fi
              sleep 5
            done
          '; then
            echo 'Emulator boot failed; last emulator output:' >&2
            tail -120 emulator-logs/emulator.txt >&2 || true
            adb devices -l >&2 || true
            exit 1
          fi
          adb shell input keyevent 82
          bash scripts/ci/android-emulator-smoke.sh emulator-apk/*.apk "${{ matrix.api }}"
      - name: Collect logcat even if smoke checks fail
        if: always()
        run: |
          mkdir -p emulator-logs
          timeout 20 adb logcat -d -v threadtime > emulator-logs/logcat.txt 2>&1 || true
          timeout 15 adb shell dumpsys activity activities > emulator-logs/activities.txt 2>&1 || true
          timeout 15 adb shell dumpsys package io.github.tigaotg.openkinguard.debug.pilotv4 > emulator-logs/package.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openkinguard-emulator-${{ matrix.api }}-logs
          path: emulator-logs/
          if-no-files-found: warn
          retention-days: 7
