name: OpenKinGuard Phase 3 network source validation (no APK)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/compile-validation.yml'
      - 'app/src/main/java/io/github/tigaotg/openkinguard/S2*'
      - 'app/src/test/java/io/github/tigaotg/openkinguard/NetworkReconnectPolicyTest.kt'
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - 'core/**'
      - 'adapters/**'
      - 'security/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Accept Android SDK licenses and install compile-only SDK
        run: |
          yes | timeout 600 sdkmanager --licenses
          timeout 600 sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run source-only compilation and JVM tests (no APK/AAB tasks)
        run: |
          # Keep Phase 2 validation source-only. Never add assemble*, bundle*, package*,
          # install*, or connected Android test tasks to this workflow.
          # This workflow validates the current source tree and JVM tests only.
          sed -i 's/compileSdk = 37/compileSdk = 36/' app/build.gradle.kts
          sed -i 's/compose-bom:2026.09.00/compose-bom:2025.10.00/' app/build.gradle.kts
          chmod +x gradlew
          ./gradlew --no-daemon \
            :app:compilePilotV4Kotlin \
            :app:testDebugUnitTest \
              --tests io.github.tigaotg.openkinguard.NetworkReconnectPolicyTest \
            --stacktrace
      - name: Preserve JVM test reports (no APK artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-network-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            core/model/build/test-results/test/*.xml
            core/contracts/build/test-results/test/*.xml
            core/engine/build/test-results/test/*.xml
            adapters/mock/build/test-results/test/*.xml
            security/protocol/build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 7
