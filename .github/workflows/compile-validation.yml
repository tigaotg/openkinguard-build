name: Android compile validation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/compile-validation.yml'

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: |
          sdkmanager --install "platforms;android-37" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testPilotV4UnitTest :app:compilePilotV4Kotlin --stacktrace
