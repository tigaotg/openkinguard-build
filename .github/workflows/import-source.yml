name: Import source archive

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-source.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Expand versioned source
        run: |
          unzip -q OpenKinGuard-0.9.17-RemoteAssist-source.zip -d "$RUNNER_TEMP/openkinguard-import"
          test -f "$RUNNER_TEMP/openkinguard-import/OpenKinGuard-0.9.17/settings.gradle.kts"
          rsync -a --exclude='.github/workflows/' "$RUNNER_TEMP/openkinguard-import/OpenKinGuard-0.9.17/" ./
      - name: Publish source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Import OpenKinGuard 0.9.17 source tree"
          git push origin HEAD:main
