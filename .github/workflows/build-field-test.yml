name: OpenKinGuard 0.10.6 72-hour field-test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-field-test.yml'
      - 'app/**'
      - 'core/**'
      - 'adapters/**'
      - 'security/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'

permissions:
  contents: read

jobs:
  android-field-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Create one-off field-test signing key
        run: |
          mkdir -p private-signing
          keytool -genkeypair -noprompt \
            -keystore private-signing/openkinguard-field-test.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 365 \
            -dname 'CN=OpenKinGuard 0.10.6 Field Test,OU=Diagnostics,O=OpenKinGuard,C=CN'
      - name: Run focused unit tests and assemble field-test APK
        run: |
          sed -i 's/compileSdk = 37/compileSdk = 36/' app/build.gradle.kts
          sed -i 's/compose-bom:2026.09.00/compose-bom:2025.10.00/' app/build.gradle.kts
          chmod +x gradlew
          ./gradlew --no-daemon :security:protocol:test :app:testDebugUnitTest :app:assembleFieldTest --stacktrace
      - name: Verify APK signature and package metadata
        run: |
          APK_FILE=$(find app/build/outputs/apk/fieldTest -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK_FILE"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK_FILE"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK_FILE" | head -n 3
          mkdir -p build-out
          cp "$APK_FILE" build-out/OpenKinGuard-0.10.6-72h-field-test.apk
          sha256sum build-out/*.apk > build-out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OpenKinGuard-0.10.6-72h-field-test
          path: build-out/*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OpenKinGuard-0.10.6-field-test-failure-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
