name: OpenKinGuard Phase 5 full source acceptance (no APK)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/phase5-validation.yml'
      - 'scripts/acceptance/**'
      - 'docs/PHASE5_ACCEPTANCE.md'

permissions:
  contents: read

jobs:
  android-full-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install compile-only Android SDK
        run: |
          yes | timeout 600 sdkmanager --licenses
          timeout 600 sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile all Android source and run full JVM regression (never assemble APK)
        run: |
          # These substitutions are CI-only, not committed to project source.
          sed -i 's/compileSdk = 37/compileSdk = 36/' app/build.gradle.kts
          sed -i 's/compose-bom:2026.09.00/compose-bom:2025.10.00/' app/build.gradle.kts
          chmod +x gradlew
          ./gradlew --no-daemon \
            :core:model:compileKotlin \
            :core:contracts:compileKotlin \
            :core:engine:test \
            :adapters:mock:test \
            :security:protocol:test \
            :app:compilePilotV4Kotlin \
            :app:testDebugUnitTest \
            --stacktrace
      - name: Upload JVM test reports (not APKs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-full-jvm-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            core/engine/build/test-results/test/*.xml
            adapters/mock/build/test-results/test/*.xml
            security/protocol/build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 14

  relay-and-acceptance-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install relay test dependencies
        run: python -m pip install --disable-pip-version-check 'cryptography>=42' 'websockets>=11,<17'
      - name: Test acceptance telemetry and release gate (no device claims)
        run: python -m unittest discover -s scripts/acceptance -p 'test_*.py' -v
      - name: Test OpenWrt relay
        run: python -m unittest discover -s openwrt-family-relay/tests -p 'test_*.py' -v
      - name: Test public relay
        run: PYTHONPATH=relay python -m unittest discover -s relay -p 'test_*.py' -v
      - name: Static Python / shell checks
        run: |
          python -m compileall -q scripts/acceptance openwrt-family-relay/plugin-files/usr/lib/openkinguard-relay relay
          sh -n openwrt-family-relay/install-on-openwrt.sh
          sh -n openwrt-family-relay/plugin-files/etc/init.d/openkinguard-relay
